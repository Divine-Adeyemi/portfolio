<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rust Tetris</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121219; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }

    <!-- The canvas where your game will be drawn -->
    <canvas id="glcanvas" tabindex='1'></canvas>

    <!-- Load your compiled game -->
    <script>
        // Make sure the name inside load() exactly matches your project name
        load("rust_tetris.wasm");
    </script>
</body>
</html>
